# Free API + Supabase PostgreSQL. No resource is created by this file alone.
services:
  - type: web
    name: dungeonbound-api
    runtime: node
    plan: free
    # The API imports the shared save schema from mobile/src.
    buildCommand: cd server && npm ci --omit=dev
    # Hosted schema is provisioned separately; runtime login has DML access only.
    startCommand: cd server && npm start
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: 24.11.0
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SCHEMA
        value: dungeonbound
