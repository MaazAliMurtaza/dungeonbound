services:
  postgres:
    image: postgres:17-alpine
    container_name: dungeonbound-postgres
    environment:
      POSTGRES_DB: dungeonbound
      POSTGRES_USER: dungeonbound
      POSTGRES_PASSWORD: dungeonbound_dev_password
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dungeonbound_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dungeonbound -d dungeonbound"]
      interval: 5s
      retries: 10
volumes:
  dungeonbound_data:
